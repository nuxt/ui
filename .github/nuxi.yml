# nuxi triage config. Reference: https://github.com/benjamincanac/nuxi#configuration
dryRun: true
maintainers:
  - benjamincanac
package:
  name: "@nuxt/ui"
upstreams:
  - nuxt/nuxt
  - unovue/reka-ui
  - tailwindlabs/tailwindcss
  - ueberdosis/tiptap
nextMajor:
