name: release

on:
  push:
    branches: [v4]
  pull_request:
    types: [closed]
    branches: [v4, v5]
  # merged release PRs, publish reruns, and prereleases all arrive here
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Cut a prerelease instead of a normal release, e.g. `beta` or `rc`. Defaults to `beta` on `v5`'
        required: false
        default: ''
      npm-tag:
        description: 'npm dist-tag to publish to. Set by uppt/release for maintenance lines, leave blank otherwise'
        required: false
        default: ''

permissions: {}

jobs:
  # open or update a draft release PR from conventional commits
  pr:
    if: |
      github.repository == 'nuxt/ui'
      && (
        (
          github.event_name == 'push'
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        ) || (
          github.event_name == 'workflow_dispatch'
          && (github.ref == 'refs/heads/v4' || github.ref == 'refs/heads/v5')
        )
      )
    runs-on: ubuntu-latest
    # one updater at a time per branch, so an older run can't finish last and overwrite the release branch
    concurrency:
      group: release-pr-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # uppt starts the changelog at the newest tag by date on any branch, so a tag
      # cut elsewhere (4.12.1 and 4.12.2 from a side branch, v5 betas for v4)
      # would drop every commit older than it
      - name: Keep only tags reachable from the branch
        run: git tag --no-merged HEAD | xargs -r git tag -d

      - uses: danielroe/uppt/pr@2c9a289359311b9661cc99886a71121209b89d17 # v0.6.14
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          checkout: false
          # a dispatch from `v5` opens the release PR against `v5`
          base-branch: ${{ github.ref_name }}
          # `v5` stays on the beta line until 5.0.0
          prerelease: ${{ inputs.prerelease || (github.ref_name == 'v5' && 'beta' || '') }}
          # same subject as past releases, and a valid conventional PR title
          title: 'chore(release): v{version}'
          # the headings of past releases, listed types render first in this order
          sections: |
            feat: :rocket: Features
            fix: :bug: Bug Fixes
            perf: :fire: Performances
            revert: :rewind: Reverts
            refactor: :nail_care: Refactors
            docs: :book: Documentation
            build: :package: Build
            types: :ocean: Types
            chore: :house_with_garden: Chore
            examples: :basketball: Examples
            test: :white_check_mark: Tests
            style: :art: Styles
            ci: :robot: CI
            new-contributors: :tada: New Contributors
            contributors: :green_heart: Contributors

  # release PR merged: tag it, cut a GitHub release, dispatch the publish run
  release:
    if: |
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && startsWith(github.event.pull_request.head.ref, 'release/v')
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.repository == 'nuxt/ui'
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: danielroe/uppt/release@2c9a289359311b9661cc99886a71121209b89d17 # v0.6.14
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # the chained dispatch lands here on the vX.Y.Z tag, build the tarball
  pack:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: pack-${{ github.ref }}
      cancel-in-progress: false
    permissions: {}
    outputs:
      files: ${{ steps.pack.outputs.files }}
    steps:
      - id: pack
        uses: danielroe/uppt/pack@2c9a289359311b9661cc99886a71121209b89d17 # v0.6.14

  # lint, typecheck and test the tag before anything reaches npm
  check:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Prepare
        run: pnpm run dev:prepare

      - parallel:
          - name: Lint
            run: pnpm run lint
          - name: Typecheck
            run: pnpm run typecheck
          - name: Test
            run: pnpm run test run

  # stage the prebuilt tarball to npm via OIDC
  publish:
    if: |
      github.event_name == 'workflow_dispatch'
      && startsWith(github.ref, 'refs/tags/v')
      && needs.pack.outputs.files != '[]'
    needs: [pack, check]
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      id-token: write
    environment: npm
    steps:
      - uses: danielroe/uppt/publish@2c9a289359311b9661cc99886a71121209b89d17 # v0.6.14
        with:
          files: ${{ needs.pack.outputs.files }}
          # v5 prereleases go to `next` rather than `beta`
          npm-tag: ${{ inputs.npm-tag || (startsWith(github.ref_name, 'v5.') && contains(github.ref_name, '-') && 'next' || '') }}
