packages:
  - ./
  - cli
  - docs
  - playgrounds/nuxt
  - playgrounds/vue
  - playgrounds/repl

ignoreWorkspaceRootCheck: true

linkWorkspacePackages: true

overrides:
  '@nuxt/kit': ^4.5.1
  '@nuxt/test-utils': 4.0.2
  '@nuxt/ui': workspace:*
  unplugin: ^3.3.0
  c12: ^3.3.4
  h3: 1.15.11
  typescript: ^6.0.3

allowBuilds:
  better-sqlite3: true
  puppeteer: true
  sharp: true
  '@parcel/watcher': false
  '@tailwindcss/oxide': false
  '@vercel/speed-insights': false
  esbuild: false
  unrs-resolver: false
  vue-demi: false

minimumReleaseAgeExclude:
  - "@nuxt/kit@4.5.1"
  - "@nuxt/schema@4.5.1"
  - '@nuxt/nitro-server@4.5.1'
  - '@nuxt/vite-builder@4.5.1'
  - nuxt@4.5.1
  - shiki-transformer-icon-highlight@0.1.0
